[project]
name = "agentflow"
version = "0.1.0"
description = "Governed, graph-based agentic SDLC orchestrator (demo: URL shortener)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    # The generated services are validated by running them:
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[project.scripts]
agentflow = "agentflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentflow*"]

[tool.setuptools.package-data]
agentflow = ["playbooks/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["agentflow/playbooks/*/files", "fixtures", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S603", "B905", "ISC004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
