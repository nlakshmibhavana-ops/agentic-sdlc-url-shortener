name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Lint
        run: ruff check .
      - name: Orchestrator tests (unit + end-to-end scenarios)
        run: pytest -q
      - name: Run all three scenarios non-interactively
        run: PY=python ./scripts/demo.sh
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-runs
          path: runs/
          retention-days: 14
